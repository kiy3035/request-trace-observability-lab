services:
  app:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-request_trace}
      DB_USER: ${DB_USER:-request_trace}
      DB_PASSWORD: ${DB_PASSWORD:-request_trace_local}
      LOG_FILE: /var/log/app/application.json
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/api/demo/slow-service?delayMs=0' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - app-logs:/var/log/app

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-request_trace}
      POSTGRES_USER: ${DB_USER:-request_trace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-request_trace_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  loki:
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    depends_on:
      - app
      - loki
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - app-logs:/var/log/app:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  alloy-data:
  app-logs:
  grafana-data:
  loki-data:
  postgres-data:


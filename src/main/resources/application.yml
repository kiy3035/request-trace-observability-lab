spring:
  application:
    name: request-trace-observability-lab
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:request_trace}
    username: ${DB_USER:request_trace}
    password: ${DB_PASSWORD:request_trace_local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  environment: ${APP_ENV:local}

logging:
  file:
    name: ${LOG_FILE:logs/application.json}

observability:
  slow:
    http-ms: ${SLOW_HTTP_MS:500}
    service-ms: ${SLOW_SERVICE_MS:500}
    sql-ms: ${SLOW_SQL_MS:200}

